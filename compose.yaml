# Installation-specific values come from a private .env file or the shell.
services:
  web:
    image: "${STRONG_IMAGE:-ghcr.io/martinwa/strong-data:latest}"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - STRONG_SECRET_KEY
      - STRONG_ALLOWED_HOSTS
      - STRONG_TRUSTED_PROXY
      - STRONG_TIME_ZONE
      - STRONG_SECRET_KEY_FILE
      - STRONG_CSRF_TRUSTED_ORIGINS
      - STRONG_UPDATE_CHECK
      - STRONG_PENDING_SWEEP_SECONDS
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: "${STRONG_NETWORK:-strong-data}"
