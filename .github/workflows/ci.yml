name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check dependency lockfile
        run: uv lock --check
      - name: Check repository hygiene
        run: uv run python tools/check_no_private_data.py
      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -q

  container:
    name: Container (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the non-root image
        run: docker build -t strong-data:ci .
      - name: Verify checks inside the container
        run: |
          docker run --rm strong-data:ci uv run pytest -q
          docker run --rm strong-data:ci uv run ruff check .
          docker run --rm strong-data:ci uv run ruff format --check .
          docker run --rm strong-data:ci uv run python tools/check_no_private_data.py
          docker run --rm strong-data:ci uv lock --check
      - name: Verify the image runs as non-root
        run: test "$(docker run --rm strong-data:ci id -u)" != "0"
      - name: Validate compose files
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.yaml config -q
          rm -f .env
          if docker compose -f compose.yaml config -q 2>/dev/null; then
            echo "Production compose must require .env" >&2
            exit 1
          fi
          docker compose -f compose.yaml -f compose.development.yaml config -q
      - name: Verify the image serves the app
        run: |
          docker run -d --name strong-data-smoke -p 127.0.0.1:8000:8000 \
            -e STRONG_SECRET_KEY=ci-test-only \
            -e STRONG_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e STRONG_DB_PATH=/app/data/strong.sqlite3 \
            strong-data:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/healthz
          docker logs strong-data-smoke
      - name: Clean up smoke container
        if: always()
        run: docker rm -f strong-data-smoke || true
